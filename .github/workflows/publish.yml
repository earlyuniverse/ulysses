name: Build and publish wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-13 = Intel x86_64, macos-14 = Apple Silicon arm64
        os: [ubuntu-latest, macos-13, macos-14, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # Needed to cross-compile Linux aarch64 wheels on x86_64 runners
      - name: Set up QEMU
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.22
        env:
          # Python versions matching python_requires = ">=3.9,<3.14"
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          # Skip PyPy (numba doesn't support it) and musl/Alpine Linux
          CIBW_SKIP: "pp* *-musllinux*"
          # Linux: native x86_64 + cross-compiled aarch64 via QEMU
          CIBW_ARCHS_LINUX: x86_64 aarch64
          # macOS: use the runner's native arch (x86_64 on macos-13, arm64 on macos-14)
          CIBW_ARCHS_MACOS: auto
          # Windows: 64-bit only (numba has no 32-bit wheels)
          CIBW_ARCHS_WINDOWS: AMD64
          # manylinux2014 = glibc >= 2.17 (RHEL 7 / Ubuntu 14.04+), maximum Linux compatibility
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
          # Smoke-test the installed wheel: verifies the C extension loads correctly
          CIBW_TEST_COMMAND: python -c "import ulysses; print('wheel OK')"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build && python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  upload_pypi:
    name: Upload to PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    # Only upload on tag pushes, not manual workflow_dispatch runs
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/ulysses
    permissions:
      id-token: write   # required for OIDC trusted publishing (no API token needed)
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
