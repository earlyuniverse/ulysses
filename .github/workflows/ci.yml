name: CI

# on:
#   push:
#     branches: [main, master]
#   pull_request:
#     branches: [main, master]

on:
  workflow_dispatch:

jobs:
  test-editable:
    name: Editable install (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable)
        run: pip install -e .

      - name: Smoke test — 1BE1F
        run: uls-calc -m 1BE1F examples/1N1F.dat

      - name: Smoke test — 2BE1F
        run: uls-calc -m 2BE1F examples/2N1F.dat

      - name: Smoke test — 1BE1F IO
        run: uls-calc -m 1BE1F examples/1N1FIO.dat

      - name: Smoke test — resonant leptogenesis
        run: uls-calc -m 2RES examples/Res.dat

  test-standard:
    name: Standard install (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: pip wheel . --no-deps -w dist/

      - name: Install from wheel
        run: pip install dist/*.whl

      - name: Smoke test — 1BE1F
        run: uls-calc -m 1BE1F examples/1N1F.dat

      - name: Smoke test — 2BE1F
        run: uls-calc -m 2BE1F examples/2N1F.dat

      - name: Smoke test — 1BE1F IO
        run: uls-calc -m 1BE1F examples/1N1FIO.dat

      - name: Smoke test — resonant leptogenesis
        run: uls-calc -m 2RES examples/Res.dat

  test-no-quadpack:
    name: Failsafe (no C extension, ${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies only (no C extension build)
        run: pip install numpy scipy matplotlib progressbar pandas python-dateutil termcolor tqdm numba mpmath mpltern multiprocess ipykernel

      - name: Verify graceful degradation — import succeeds with warning
        run: |
          python - <<'EOF'
          import warnings
          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter("always")
              import ulysses
          quadpack_warnings = [w for w in caught if issubclass(w.category, ImportWarning)]
          assert len(quadpack_warnings) == 1, f"Expected 1 ImportWarning, got {len(quadpack_warnings)}"
          assert "Case" in str(quadpack_warnings[0].message), "Warning should mention Case models"
          # Core models must still be importable
          assert hasattr(ulysses, 'EtaB_1BE1F'), "EtaB_1BE1F should be available without NumbaQuadpack"
          assert hasattr(ulysses, 'EtaB_2BE1F'), "EtaB_2BE1F should be available without NumbaQuadpack"
          # Case models must be absent
          assert not hasattr(ulysses, 'EtaB_1BE1F_CaseS2'), "CaseS2 should not be available without NumbaQuadpack"
          assert not hasattr(ulysses, 'EtaB_1BE1F_Case2'),  "Case2 should not be available without NumbaQuadpack"
          print("Failsafe OK: import succeeded with warning, Case models absent, core models present")
          EOF
