name: CI

# on:
#   push:
#     branches: [main, master]
#   pull_request:
#     branches: [main, master]

on:
  workflow_dispatch:

jobs:
  test-editable:
    name: Editable install (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13","3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package (editable)
        run: pip install -e .

      - name: Smoke test — 1BE1F
        run: uls-calc -m 1BE1F examples/1N1F.dat

      - name: Smoke test — 2BE1F
        run: uls-calc -m 2BE1F examples/2N1F.dat

      - name: Smoke test — 1BE1F IO
        run: uls-calc -m 1BE1F examples/1N1FIO.dat

      - name: Smoke test — resonant leptogenesis
        run: uls-calc -m 2RES examples/Res.dat

  test-standard:
    name: Standard install (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13","3.14"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build wheel
        run: pip wheel . --no-deps -w dist/

      - name: Install from wheel
        run: pip install dist/*.whl

      - name: Smoke test — 1BE1F
        run: uls-calc -m 1BE1F examples/1N1F.dat

      - name: Smoke test — 2BE1F
        run: uls-calc -m 2BE1F examples/2N1F.dat

      - name: Smoke test — 1BE1F IO
        run: uls-calc -m 1BE1F examples/1N1FIO.dat

      - name: Smoke test — resonant leptogenesis
        run: uls-calc -m 2RES examples/Res.dat

 