[build-system]
# Build-time requirements.
# Prerequisites that CANNOT be pip-installed and must be on the system PATH:
#   - A C compiler (gcc / clang / MSVC)
#   - cmake  >=3.10  (pip installs the cmake wheel automatically if absent)
# Recommended: ninja (faster cmake generator, e.g. apt install ninja-build)
#
# setuptools>=77 is required for SPDX-style licence declaration.
# cmake>=3.15 ensures compatibility with CMake 4.x policy changes.
requires = [
    "setuptools>=77.0.0",
    "wheel>=0.38",
    "cmake>=3.15",
]
build-backend = "setuptools.build_meta"

# ---------------------------------------------------------------------------
# Project metadata — takes precedence over setup.py kwargs in setuptools>=77.
# The CMake extension, custom build_ext, and bin/ scripts are still declared
# in setup.py because pyproject.toml has no equivalent for non-entry-point
# scripts or custom build commands.
# ---------------------------------------------------------------------------

[project]
name            = "ulysses"
version         = "2.0.2"
description     = "ULYSSES: Universal LeptogeneSiS Equation Solver"
readme          = "README.md"
license         = "MIT"
license-files   = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    {name = "Alessandro Granelli"},
    {name = "Christopher Leslie"},
    {name = "Yuber Perez Gonzalez"},
    {name = "Brian Shuve"},
    {name = "Holger Schulz"},
    {name = "Jessica Turner", email = "jessicaturner.5390@gmail.com"},
    {name = "Rosie Walker"},
]

# Lower bounds ensure pre-built wheels exist for all supported Python versions,
# preventing fallback to source builds that require extra system headers.
dependencies = [
    "numpy>=1.22",
    "scipy>=1.7",
    "matplotlib>=3.5",
    "pymultinest>=2.11",
    "progressbar>=2.5",
    "pandas>=1.5",
    "python-dateutil>=2.8",
    "termcolor>=1.1",
    "tqdm>=4.60",
    "numba>=0.55",
    "mpmath>=1.2",
    "mpltern>=0.4",
    "multiprocess>=0.70.12",
]

[project.urls]
Homepage   = "https://github.com/earlyuniverse/ulysses"
Repository = "https://github.com/earlyuniverse/ulysses"

# ---------------------------------------------------------------------------
# Package discovery — exclude the local virtual-env and build artefacts so
# setuptools does not accidentally bundle them.
# ---------------------------------------------------------------------------

[tool.setuptools.packages.find]
exclude = ["ulyssesv3_env*", "build*", "dist*", "*.egg-info"]

[tool.setuptools]
include-package-data = true
